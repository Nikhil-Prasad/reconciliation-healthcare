[project]
name = "reconciliation-healthcare"
version = "0.1.0"
description = "An auditable U.S. Healthcare Claims Ledger built from CMS NHEA data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.3,<4",
    "pyarrow>=20,<24",
    "tabulate>=0.9,<1",
    "xlrd>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[project.scripts]
hcl-download = "reconciliation_healthcare.download:main"
hcl-inspect = "reconciliation_healthcare.inspect_nhea:main"
hcl-build = "reconciliation_healthcare.ledger:main"
hcl-validate = "reconciliation_healthcare.validation:main"
hcl-rulebook-download = "reconciliation_healthcare.rulebook.sources:main"
hcl-rulebook-build = "reconciliation_healthcare.rulebook.build:main"
hcl-rulebook-validate = "reconciliation_healthcare.rulebook.validation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconciliation_healthcare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
